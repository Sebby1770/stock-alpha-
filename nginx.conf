server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /stock-alpha-/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location /stock-alpha-/ {
    add_header Cache-Control "no-cache";
    # nginx stops inheriting server-level add_header directives as soon as a
    # location defines one, so repeat the security headers here explicitly.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /stock-alpha-/index.html;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "ok\n";
  }
}
